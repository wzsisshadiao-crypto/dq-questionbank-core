[build-system]
requires = ["setuptools>=69"]
build-backend = "setuptools.build_meta"

[project]
name = "dq-questionbank-core"
version = "1.1.1"
description = "Open infrastructure for structured educational questions."
readme = "README.md"
requires-python = ">=3.10"
authors = [{ name = "DQ QuestionBank Core contributors" }]
license = {text = "Apache-2.0"}
keywords = ["education", "question-bank", "schema", "docx", "latex"]
classifiers = [
  "Development Status :: 4 - Beta",
  "Intended Audience :: Developers",
  "License :: OSI Approved :: Apache Software License",
  "Programming Language :: Python :: 3",
  "Programming Language :: Python :: 3.10",
  "Programming Language :: Python :: 3.11",
  "Programming Language :: Python :: 3.12",
]

[project.urls]
Homepage = "https://github.com/wzsisshadiao-crypto/dq-questionbank-core"
Repository = "https://github.com/wzsisshadiao-crypto/dq-questionbank-core"
Issues = "https://github.com/wzsisshadiao-crypto/dq-questionbank-core/issues"

[project.optional-dependencies]
docx = ["python-docx>=1.1,<2"]
dev = [
  "pytest>=8,<9",
  "ruff>=0.6,<1",
  "build>=1.2,<2",
  "jsonschema>=4.23,<5",
  "reportlab>=4,<5",
]

[project.scripts]
dq = "dq_questionbank.cli:main"
dq-local = "dq_questionbank_local.cli:main"

[tool.setuptools]
package-dir = {"" = "src"}
include-package-data = true
license-files = ["LICENSE"]

[tool.setuptools.data-files]
"share/dq-questionbank-core/schema" = [
  "schema/question-set.schema.json",
  "schema/question-set-1.1.schema.json",
]

[tool.setuptools.packages.find]
where = ["src"]

[tool.setuptools.package-data]
dq_questionbank = ["web/*", "data/import_cases/**/*", "data/word_macro/*"]
dq_questionbank_local = [
  "web/*",
  "web/vendor/katex/*",
  "web/vendor/katex/fonts/*",
  "data/*",
]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q"

[tool.ruff]
target-version = "py310"
line-length = 105

[tool.ruff.lint]
select = ["E", "F", "I", "UP", "B"]
