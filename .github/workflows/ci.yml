name: CI

on:
  push:
  pull_request:

permissions:
  contents: read

jobs:
  test:
    runs-on: ubuntu-latest
    strategy:
      fail-fast: false
      matrix:
        python-version: ["3.10", "3.11", "3.12"]
    steps:
      - uses: actions/checkout@v4
      - uses: actions/setup-python@v5
        with:
          python-version: ${{ matrix.python-version }}
          cache: pip
      - name: Install
        run: python -m pip install -e ".[docx,dev]"
      - name: Lint
        run: python -m ruff check src tests scripts
      - name: Check stable public API manifest
        run: python scripts/check_public_api.py
      - name: Test
        run: python -m unittest discover -s tests -v
      - name: Audit public tree
        run: python scripts/audit_public_tree.py
      - name: Check documentation links
        run: python scripts/check_docs.py
      - name: Verify Wiki source and export determinism
        run: |
          python scripts/wiki_sync.py check-manifest
          python scripts/wiki_sync.py export "$RUNNER_TEMP/dq-wiki"
          python scripts/wiki_sync.py check "$RUNNER_TEMP/dq-wiki"
      - name: Build distributions
        if: matrix.python-version == '3.12'
        run: python -m build
