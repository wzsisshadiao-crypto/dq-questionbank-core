name: Bug report
description: Report a reproducible problem using synthetic data.
title: "[Bug]: "
labels: ["bug"]
body:
  - type: markdown
    attributes:
      value: "Do not attach private, personal, credential-bearing, or copyrighted question-bank data."
  - type: textarea
    id: summary
    attributes:
      label: Summary
      description: What happened, and what did you expect?
    validations:
      required: true
  - type: textarea
    id: reproduction
    attributes:
      label: Minimal synthetic reproduction
      render: shell
    validations:
      required: true
  - type: input
    id: version
    attributes:
      label: Package and Python versions
    validations:
      required: true

