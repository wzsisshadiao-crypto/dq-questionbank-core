<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8">
    <meta name="viewport" content="width=device-width, initial-scale=1">
    <meta name="robots" content="index,follow">
    <title>DQ QuestionBank Core</title>
    <link rel="alternate" hreflang="en" href="./en/">
    <link rel="alternate" hreflang="zh-CN" href="./zh-CN/">
    <link rel="alternate" hreflang="x-default" href="./en/">
    <script>
      const language = navigator.languages?.[0] || navigator.language || "en";
      window.location.replace(language.toLowerCase().startsWith("zh") ? "./zh-CN/" : "./en/");
    </script>
  </head>
  <body>
    <p><a href="./en/">English</a> · <a href="./zh-CN/">简体中文</a></p>
  </body>
</html>
